name: LaBete
options:
  bundleIdPrefix: com.novaera.france
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.1'
    CURRENT_PROJECT_VERSION: '2026100202'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 2XQ2KGW9SB
targets:
  LaBete:
    type: application
    platform: iOS
    sources: [LaBete]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novaera.france.beast
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: La Bête · France
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  LaBeteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: LaBete
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  LaBeteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: LaBete
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LaBete:
    build:
      targets:
        LaBete: all
    test:
      targets: [LaBeteTests, LaBeteUITests]
  LaBetePerformance:
    build:
      targets:
        LaBeteUITests: all
    test:
      config: Release
      targets: [LaBeteUITests]
