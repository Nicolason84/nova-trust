name: Publish verified KRIMI Lab APK
on:
  push:
    branches: [lab/krimi-android-20260920]
    paths: [.github/workflows/krimi-native-publish.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish only the verified bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,urllib.parse,hashlib,zipfile,pathlib,subprocess,re,time
          repo=os.environ['GITHUB_REPOSITORY']; assert repo=='Nicolason84/nova-trust'
          api='https://api.github.com/repos/'+repo
          token=os.environ['GH_TOKEN']; src='926bb3cc0367a1b6b2c3d17f231f6c19513f8e69'
          tag='krimi-lab-1.0-20260920'
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'KRIMI-release-verifier'}
          def request(url,method='GET',obj=None,data=None,mime=None):
              h=dict(headers)
              if obj is not None: data=json.dumps(obj).encode();h['Content-Type']='application/json'
              if mime:h['Content-Type']=mime
              with urllib.request.urlopen(urllib.request.Request(url,data=data,headers=h,method=method),timeout=60) as r:return json.load(r)
          run=request(api+'/actions/runs/35498450629')
          assert run['conclusion']=='success' and run['head_sha']==src
          artifact=request(api+'/actions/artifacts/10601707903')
          assert artifact['name']=='krimi-native-verified-delivery' and not artifact['expired']
          assert artifact['workflow_run']['head_sha']==src
          subprocess.run(['curl','-fLsS','--max-time','120','--proto','=https','--proto-redir','=https','-H','Authorization: Bearer '+token,api+'/actions/artifacts/10601707903/zip','-o','verified.zip'],check=True)
          raw=pathlib.Path('verified.zip').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='4caea2fd1d67b78ca51c55f11befe2e876aff483b7a682283504c4315f6b1b16'
          root=pathlib.Path('delivery');root.mkdir()
          with zipfile.ZipFile('verified.zip') as z:
              assert z.testzip() is None
              for n in z.namelist():
                  assert not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts
              z.extractall(root)
          apk=root/'KRIMI-Lab-1.0.apk';expected='dcd70ad8eff6370333044fff50e2f55c67ddaa7ed3d3103cae3020e5f651d673'
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==expected
          assert (root/'SOURCE_COMMIT.txt').read_text().strip()==src
          tests=(root/'native-instrumentation.txt').read_text();assert re.search(r'TOTAL 64 PASS 0 FAIL',tests)
          signature=(root/'signature.txt').read_text();assert 'Verified using v2 scheme (APK Signature Scheme v2): true' in signature
          assert '6f17d1ee37a248d1aa35a58f5fccddbfcc457617ec648045565a5b52d2e1be87' in signature
          notes='''## KRIMI Lab 1.0 — premier échange Android natif

          Télécharger **KRIMI-Lab-1.0.apk** dans les fichiers ci-dessous, puis ouvrir le fichier sur le téléphone Android.

          Application Java native sans WebView. Android 8 minimum (API 26). Questionnaire, fiches de cartes, photos recto/verso/détail, sauvegarde locale, import et réimportation contrôlée, partage explicite du dossier et laboratoire visuel isolé. Aucun historique personnel embarqué.

          **64 contrôles natifs réussis sur émulateur Android 15 / API 35** : installation, démarrage, stockage, images synthétiques, association des photos, validation des imports, contrôle des doublons exacts, ZIP, permissions, séparation LAB. Redémarrage à froid réussi. Signature v2 et v3 vérifiée.

          **Limites :** pas de test sur téléphone physique, d'optique caméra réelle ni de partage WhatsApp de bout en bout. Cette édition n'a pas de permission Internet, de serveur SUPRA connecté, de chat temps réel, d'IA distante ou de cote automatique. Le mot « Échange » désigne des notes locales et le partage Android, pas un message déjà reçu par Nicolas. Une nouvelle photo du même objet n'est pas une identité physique vérifiée.

          Version de laboratoire séparée : `com.novaera.krimiquest.lab`. Ne remplace pas l'app historique. Sauvegarder le dossier avant toute désinstallation. Garder Play Protect activé ; ne pas contourner une alerte de sécurité.

          SHA-256 APK : `dcd70ad8eff6370333044fff50e2f55c67ddaa7ed3d3103cae3020e5f651d673`

          Source et tests : run https://github.com/Nicolason84/nova-trust/actions/runs/35498450629 . Le ZIP de sources contient l'application complète reconstituée, pas seulement les fragments de transport. Aucune clé privée dans les fichiers publics.
          '''
          try:
              existing=request(api+'/releases/tags/'+tag)
          except urllib.error.HTTPError as e:
              if e.code!=404:raise
              existing=None
          assert existing is None,'Existing release preserved; refusing overwrite'
          release=request(api+'/releases','POST',{'tag_name':tag,'target_commitish':src,'name':'KRIMI Lab 1.0 — Android natif','body':notes,'draft':True,'prerelease':True,'make_latest':'false'})
          upload=release['upload_url'].split('{')[0];assert urllib.parse.urlparse(upload).netloc=='uploads.github.com'
          names=['KRIMI-Lab-1.0.apk','KRIMI_Lab_sources.zip','SHA256SUMS.txt','LIRE_MOI.txt','native-instrumentation.txt','signature.txt','source-integrity.json','SOURCE_COMMIT.txt']
          assets=[]
          for n in names:
              p=root/n;mime='application/vnd.android.package-archive' if n.endswith('.apk') else 'application/zip' if n.endswith('.zip') else 'application/json' if n.endswith('.json') else 'text/plain; charset=utf-8'
              asset=request(upload+'?name='+urllib.parse.quote(n),'POST',data=p.read_bytes(),mime=mime)
              assert asset['state']=='uploaded' and asset['size']==p.stat().st_size
              assets.append(asset)
          release=request(api+'/releases/'+str(release['id']),'PATCH',{'draft':False,'prerelease':True,'make_latest':'false'})
          published=next(a for a in assets if a['name']=='KRIMI-Lab-1.0.apk')
          url=published['browser_download_url'];assert url.startswith('https://github.com/'+repo+'/releases/download/')
          last=None
          for attempt in range(6):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'KRIMI-anonymous-download-check'})
                  with urllib.request.urlopen(req,timeout=60) as r:
                      code=r.status; final=r.url; downloaded=r.read()
                  assert code==200 and hashlib.sha256(downloaded).hexdigest()==expected
                  last=None;break
              except Exception as e:last=e;time.sleep(3)
          if last:raise last
          report={'status':'PUBLISHED_AND_ANONYMOUS_DOWNLOAD_VERIFIED','release_url':release['html_url'],'apk_url':url,'http_status':code,'bytes':len(downloaded),'sha256':expected,'source_commit':src,'build_run_id':35498450629,'native_checks':{'passed':64,'failed':0},'physical_device_tested':False,'connected_SUPRA':False,'private_key_published':False,'release_id':release['id'],'asset_id':published['id']}
          pathlib.Path('publication-verification.json').write_text(json.dumps(report,indent=2,ensure_ascii=False));print(json.dumps(report,indent=2,ensure_ascii=False))
          PY
      - name: Preserve publication proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: krimi-publication-proof
          path: publication-verification.json
          retention-days: 7
          if-no-files-found: error
