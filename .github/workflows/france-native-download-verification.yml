name: France native download verification
on:
  push:
    branches: [mission/france-beast-native-mobile-20261002]
    paths: [.github/workflows/france-native-download-verification.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  anonymous-download:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public signed APK and prove its exact bytes
        run: |
          python3 - <<'PYCODE'
          import urllib.request,hashlib,json,datetime
          url='https://github.com/Nicolason84/nova-trust/releases/download/france-beast-native-0.1.1-20261002/La-Bete-France-0.1.1.apk'
          with urllib.request.urlopen(url,timeout=60) as response:
              data=response.read();status=response.status
          actual=hashlib.sha256(data).hexdigest()
          expected='b9edd9d483c4955fb44686d48cc025ab7deb0e3aefc66e00cd9a3be06ff07005'
          assert status==200 and actual==expected
          print(json.dumps({'status':'PASS_ANONYMOUS_EXTERNAL_DOWNLOAD','url':url,'http_status':status,'bytes':len(data),'sha256':actual,'network':'GitHub hosted Ubuntu runner','at':datetime.datetime.now(datetime.timezone.utc).isoformat()}))
          PYCODE
