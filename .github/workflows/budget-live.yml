name: Budget 2027 Reality Pulse

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/budget-live.yml'
      - 'scripts/update_budget_live.py'
      - 'docs/data/budget-2027-live.json'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: budget-2027-reality-pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Refresh public evidence fingerprints
        run: python3 scripts/update_budget_live.py

      - name: Commit material delta only
        shell: bash
        run: |
          if git diff --quiet -- docs/data/budget-2027-live.json; then
            echo "No material public-source delta. Heartbeat successful; repository stays unchanged."
            exit 0
          fi
          git config user.name "ojo-reality-pulse[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/budget-2027-live.json
          git commit -m "data: Budget 2027 reality pulse delta"
          git push
