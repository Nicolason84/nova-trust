name: Budget 2027 Reality Pulse

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/budget-live.yml"
      - "scripts/update_budget_live.py"
      - "scripts/update_environment_live.py"
      - "scripts/update_organism_model.py"
      - "docs/data/budget-2027-live.json"
      - "docs/data/environment-live.json"
      - "docs/data/organism-state.json"
      - "scripts/update_france_organism.py"
      - "docs/data/france-organism.json"
      - "docs/data/france-topology.json"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: budget-2027-reality-pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Refresh budget evidence
        run: python3 scripts/update_budget_live.py

      - name: Refresh external environment
        run: python3 scripts/update_environment_live.py

      - name: Model organism state
        run: python3 scripts/update_organism_model.py

      - name: Model France organism
        run: python3 scripts/update_france_organism.py

      - name: Validate organism invariants
        shell: bash
        run: |
          python3 - <<'PY'
          import json, sys
          p="docs/data/organism-state.json"
          j=json.load(open(p))
          s=j.get("state",{})
          req=["strain","vigilance","arms","regime","heart_rate_visual","sensor_health"]
          missing=[k for k in req if k not in s]
          if missing:
              raise SystemExit(f"missing state fields: {missing}")
          if not (0 <= float(s["strain"]) <= 1):
              raise SystemExit("strain out of range")
          if not (0 <= float(s["vigilance"]) <= 1):
              raise SystemExit("vigilance out of range")
          if not (0 <= float(s["sensor_health"]) <= 1):
              raise SystemExit("sensor health out of range")
          arms=s["arms"]
          expected={"macro","budget","energy","finance","logistics","climate","health","geopolitics"}
          if set(arms)!=expected:
              raise SystemExit(f"arm mismatch: {set(arms)^expected}")
          for k,v in arms.items():
              if not (0 <= float(v) <= 1):
                  raise SystemExit(f"arm out of range: {k}={v}")
          hist=j.get("history",[])
          if len(hist)>672:
              raise SystemExit("history overflow")
          if j.get("policy",{}).get("event_is_not_impact") is not True:
              raise SystemExit("truth invariant broken")
          print("ORGANISM_INVARIANTS_PASS")

          f=json.load(open("docs/data/france-organism.json"))
          counts=f.get("topology",{}).get("counts",{})
          if counts.get("regions") != 18:
              raise SystemExit(f"unexpected region count: {counts.get('regions')}")
          if counts.get("communes",0) < 30000:
              raise SystemExit(f"unexpected commune count: {counts.get('communes')}")
          if len(f.get("topology",{}).get("regions",[])) != 18:
              raise SystemExit("France region topology incomplete")
          print("FRANCE_TOPOLOGY_INVARIANTS_PASS")
          PY

      - name: Commit material state
        shell: bash
        run: |
          if git diff --quiet -- docs/data/budget-2027-live.json docs/data/environment-live.json docs/data/organism-state.json docs/data/france-organism.json docs/data/france-topology.json; then
            echo "No material state delta. Heartbeat successful."
            exit 0
          fi
          git config user.name "ojo-reality-pulse[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/budget-2027-live.json docs/data/environment-live.json docs/data/organism-state.json docs/data/france-organism.json docs/data/france-topology.json
          git commit -m "data: France organism pulse"
          git push
