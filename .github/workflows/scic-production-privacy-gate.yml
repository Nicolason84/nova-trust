name: SCIC Production Privacy Gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'privacy/rfc9474_gate/**'
      - 'privacy/ohttp_runtime/**'
      - 'app/scic_privacy_gate.py'
      - 'app/scic_circl_runtime.py'
      - 'app/scic_ohttp_runtime.py'
      - 'app/scic_batch_runtime.py'
      - 'app/scic_key_custody.py'
      - 'scripts/test_scic_privacy_gate.py'
      - 'scripts/test_scic_circl_runtime.py'
      - 'scripts/test_scic_ohttp_runtime.py'
      - 'scripts/test_scic_batch_runtime.py'
      - 'scripts/test_scic_ohttp_batch_pipeline.py'
      - 'scripts/test_scic_key_custody.py'
      - 'scripts/build_scic_privacy_audit_pack.py'
      - 'scripts/test_scic_privacy_audit_pack.py'
      - 'audits/scic_privacy/**'
      - 'scripts/la_bete_acquisition.py'
      - 'scripts/test_la_bete_acquisition.py'
      - 'scripts/verify_la_bete_evolution.py'
      - 'docs/assets/la-bete-explorer.js'
      - 'scripts/test_la_bete_explorer.cjs'
      - 'scripts/test_la_bete_explorer_browser.cjs'
      - 'receipts/LA_BETE_SCIC_PRODUCTION_PRIVACY_GATE_PROOF.json'
      - 'LA_BETE_SCIC_PRODUCTION_PRIVACY_GATE_20261004_REPORT.md'
      - '.github/workflows/scic-production-privacy-gate.yml'

permissions:
  contents: read

jobs:
  rfc9474-rfc9578:
    name: RFC9474 / RFC9578 + CIRCL runtime binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: privacy/rfc9474_gate/go.sum
      - name: Verify pinned Go dependency checksums
        working-directory: privacy/rfc9474_gate
        run: |
          go mod download
          go mod verify
      - name: Run project RFC gate
        working-directory: privacy/rfc9474_gate
        run: go test -v ./...
      - name: Run CIRCL upstream blindrsa RFC9474 suite
        working-directory: privacy/rfc9474_gate
        run: go test -v github.com/cloudflare/circl/blindsign/blindrsa
      - name: Build CIRCL runtime sidecar
        working-directory: privacy/rfc9474_gate
        run: go build -trimpath -o /tmp/scic-circl-runtime ./cmd/scic-circl-runtime
      - name: Prove Python-to-CIRCL runtime binding
        env:
          PYTHONPATH: .
          SCIC_CIRCL_RUNTIME_BIN: /tmp/scic-circl-runtime
        run: python3 scripts/test_scic_circl_runtime.py
      - name: Record Go dependency graph
        working-directory: privacy/rfc9474_gate
        run: |
          go version
          go list -m all

  ohttp-rfc9458:
    name: RFC9458 OHTTP + persistent batching runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.86.0 --profile minimal
          rustup default 1.86.0
          rustc --version
          cargo --version
      - name: Verify pinned Rust dependency lock
        working-directory: privacy/ohttp_runtime
        run: cargo fetch --locked
      - name: Build pinned OHTTP runtime
        working-directory: privacy/ohttp_runtime
        run: cargo build --locked --release
      - name: Run Rust crate tests
        working-directory: privacy/ohttp_runtime
        run: cargo test --locked
      - name: Prove client-relay-gateway runtime separation
        run: SCIC_OHTTP_RUNTIME_BIN="$GITHUB_WORKSPACE/privacy/ohttp_runtime/target/release/scic_ohttp_runtime" PYTHONPATH=. python3 scripts/test_scic_ohttp_runtime.py
      - name: Prove persistent OHTTP batching pipeline
        run: SCIC_OHTTP_RUNTIME_BIN="$GITHUB_WORKSPACE/privacy/ohttp_runtime/target/release/scic_ohttp_runtime" PYTHONPATH=. python3 scripts/test_scic_ohttp_batch_pipeline.py
      - name: Record pinned OHTTP dependency graph
        working-directory: privacy/ohttp_runtime
        run: |
          cargo metadata --locked --format-version 1 --no-deps > /tmp/ohttp-metadata.json
          sha256sum Cargo.lock

  policy-audit-gates:
    name: Batching, key custody and audit-pack gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fail-closed privacy policy tests
        env:
          PYTHONPATH: .
        run: python3 scripts/test_scic_privacy_gate.py
      - name: Run persistent batching tests
        env:
          PYTHONPATH: .
        run: python3 scripts/test_scic_batch_runtime.py
      - name: Run key custody contract tests
        env:
          PYTHONPATH: .
        run: python3 scripts/test_scic_key_custody.py
      - name: Run audit pack tests
        env:
          PYTHONPATH: .
        run: python3 scripts/test_scic_privacy_audit_pack.py
      - name: Build clean audit pack
        env:
          PYTHONPATH: .
        run: |
          python3 scripts/build_scic_privacy_audit_pack.py
          python3 -c 'import json; p=json.load(open("audits/scic_privacy/SCIC_PRIVACY_AUDIT_PACK_V1.json")); assert p["source_dirty"] is False; assert p["audit_verdict"] == "NOT_PERFORMED"; assert p["contains_private_state"] is False'
      - name: Run public model guards
        run: python3 scripts/test_la_bete_acquisition.py
      - name: Run static explorer guards
        run: node scripts/test_la_bete_explorer.cjs
      - name: Diff hygiene
        run: git diff --check
