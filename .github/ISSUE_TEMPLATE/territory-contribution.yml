name: Enrichir un territoire
description: Ajouter une source, une correction, une traduction, un parler local, un lieu, un savoir-faire ou un récit territorial.
title: "[TERRITOIRE] "
labels:
  - territoire
body:
  - type: markdown
    attributes:
      value: |
        Merci. Une contribution n'est pas automatiquement publiée ni récompensée.
        Les Φ Coins sont des points civiques non monétaires et non transférables. Ils ne sont attribués qu'après vérification.
  - type: input
    id: department
    attributes:
      label: Département
      description: Nom ou code du département concerné.
      placeholder: "Oise · 60"
    validations:
      required: true
  - type: dropdown
    id: quest
    attributes:
      label: Quête Φ TERRITORY QUESTS
      description: Choisissez l’objectif auquel votre contribution doit faire progresser le département.
      options:
        - language_context · Documenter le parler local
        - local_expressions · Documenter 5 expressions locales
        - heritage_memory · Sourcer patrimoine ou mémoire
        - know_how · Raconter un savoir-faire ou métier
        - people_stories · Documenter une figure ou un récit local
        - events_traditions · Sourcer un événement ou une tradition
        - nature_risks · Documenter paysage, milieu ou risque
        - local_initiatives · Identifier une initiative locale utile
        - translations · Traduire et faire relire
        - accessibility · Améliorer compréhension ou accessibilité
    validations:
      required: true
  - type: input
    id: candidate_reference
    attributes:
      label: Référence candidat (facultatif)
      description: Si vous venez d'une carte « candidat à vérifier » de La Bête, copiez sa référence candidate:… / heritage:… / nature:… affichée dans le titre du lien.
      placeholder: "heritage:merimee:PA…"
  - type: dropdown
    id: contribution_type
    attributes:
      label: Type de contribution
      options:
        - Source officielle
        - Correction démontrée
        - Traduction
        - Langue ou expression locale
        - Patrimoine ou mémoire
        - Savoir-faire ou métier
        - Lieu
        - Événement ou tradition
        - Accessibilité / compréhension
        - Initiative locale utile
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: Ce que vous proposez
      description: Expliquez simplement ce qui manque ou doit être corrigé.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source ou contexte
      description: Lien public de préférence. Pour un témoignage, indiquez clairement qu'il s'agit d'un témoignage.
      placeholder: "https://… ou témoignage local"
    validations:
      required: true
  - type: textarea
    id: local_language_context
    attributes:
      label: Si c'est une langue ou expression locale
      description: Donnez la forme exacte, le lieu où elle est utilisée, le sens et la source ou le contexte.
  - type: checkboxes
    id: phi
    attributes:
      label: Règle Φ
      options:
        - label: Je comprends que les Φ n'ont aucune valeur monétaire, ne s'achètent pas et ne se transfèrent pas.
          required: true
        - label: Je comprends que la contribution doit être vérifiée avant tout reçu Φ.
          required: true
